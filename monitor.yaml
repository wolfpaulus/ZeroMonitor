# Configuration file for monitoring systems' health and performance
displays:
  neopixel:
    brightness: 127 # Brightness of the strip (24-255)
    sensor_timeout: 1 # Pause after probing a sensor
    off_: "20:00" # Turn off at 20:00, on at 6:30
    on_: "6:30" # Turn on at 6:30, off at 8:00
    mode: 2 # up to 4 hosts, one row per host

sensors: # All sensors to monitor
  CpuUsage:
    name: CpuUsage
    description: CPU usage percentage
    cmd: mpstat -P ALL 1 1 | awk '$1 == "Average:" && $2 == "all" {printf "%.0f\n", 100 - $NF}' # CPU usage percentage
    values: # idle, normal, high
      - 3
      - 15
      - 30

  CpuTemperature:
    name: CpuTemperature
    description: CPU package temperature in Celsius
    cmd: awk '{print int($1/1000)}' /sys/class/thermal/thermal_zone2/temp # CPU package temperature
    values: # low, normal, high
      - 50
      - 62
      - 75

  MemoryUsage:
    name: MemoryUsage
    description: Memory usage percentage
    cmd: free | awk '/^Mem:/ {printf "%.0f\n", $3/$2*100}'
    values: # low, normal, high
      - 25
      - 50
      - 75

  DiskUsage:
    name: DiskUsage
    description: Disk usage percentage
    cmd: df / | awk 'NR==2 {gsub("%","",$5); print $5}'
    values: # low, normal, high
      - 30
      - 55
      - 80

  TaskCount:
    name: TaskCount
    description: Number of running tasks
    cmd: ps -e | wc -l
    values: # low, normal, high
      - 150
      - 175
      - 200

  StreamlitSessions:
    name: StreamlitSessions
    description: Number of active Streamlit sessions
    cmd: wget -qO- http://localhost:8001/_stcore/metrics | awk '/^active_sessions/ {print $2}'
    values: # low, normal, high
      - 1
      - 3
      - 5

hosts: # List of hosts to monitor
  - hostname: alpha # Intel NUC Core i5
    details: NUC CoreI5 16GB 256GB SSD

  - hostname: beta # Intel NUC Core i3
    details: NUC CoreI3 16GB 128GB SSD

  - hostname: m6 # Apple M6
    details: Mac mini M6 16GB 512GB SSD
    CpuUsage:
      cmd: top -l 1 | awk '/CPU usage/ {printf "%.0f\n", 100 - $7}'
      values: # idle, normal, high
        - 9
        - 15
        - 30
    CpuTemperature:
      cmd: sudo powermetrics --samplers thermal -n 1 2>/dev/null | awk '/Current pressure level/ {if ($NF=="Nominal") print 0; else if ($NF=="Moderate") print 1; else if ($NF=="Heavy") print 2; else if ($NF=="Trapping") print 3}'
      values: # low, normal, high
        - 0
        - 1
        - 2
    MemoryUsage:
      cmd: memory_pressure | awk '/System-wide memory free percentage/ {gsub("%","",$5); printf "%.0f\n", 100-$5}'
      values: # low, normal, high
        - 25
        - 50
        - 75
    TaskCount:
      values: # low, normal, high
        - 650
        - 700
        - 750
    StreamlitSessions:
      cmd: /opt/homebrew/bin/wget -qO- http://localhost:8001/_stcore/metrics | awk '/^active_sessions/ {print $2}'

  - hostname: orion # Raspberry Zero 2
    details: RPi Zero 2 512 MB RAM
    CpuTemperature:
      cmd: awk '{print int($1/1000)}' /sys/class/thermal/thermal_zone0/temp # CPU package temperature
    MemoryUsage:
      values: # low, normal, high
        - 40
        - 50
        - 75

